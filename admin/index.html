<!-- Sveltia CMS, pinned to one release and checked against its hash, since the page holds a token that
     can write to the repository. The import map checks the rest of the CMS the same way: every file in its
     chunks/ folder (React DOM, for the preview in preview.js, among them; they come last, as README.md's
     command prints them), Immutable, which it loads on every visit, and the code highlighter's engine,
     which it loads for a post with a code block or in Markdown mode. Modules it fetches only on demand,
     such as a language's grammar for code highlighting or the WebP encoder Safari uses for uploads, are
     pinned by version but not hash-checked. The one module they ask for by a version range,
     wasm-feature-detect (the encoder's), is pinned and hash-checked here. It reads config.yml beside this
     page. README.md explains updating all of these. -->
<script type="importmap">{"imports":{
